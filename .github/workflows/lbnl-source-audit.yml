name: Berkeley Lab 2026 source-package audit (research-only)

on:
  push:
    branches:
      - "audit/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[lbnl-source-audit]'))
    name: Inspect official LBNL 2026 user guide and public CSV
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check pypdf gdown pymupdf zstandard
      - name: Download and inspect official LBNL source files
        run: python scripts/audit_lbnl_source_files.py
      - name: Retain public guide-page render previews (no raw CSV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lbnl-2026-guide-render-preview
          path: lbnl-guide-renders/*.png
          if-no-files-found: warn
          retention-days: 3
