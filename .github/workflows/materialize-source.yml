name: One-time source materialization

on:
  push:
    branches: [main]
    paths:
      - ".staging/READY"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Decode and verify source archive
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import lzma
          import tarfile
          from pathlib import Path

          stage = Path(".staging")
          chunk_files = sorted(stage.glob("chunk-*.b85"))
          if len(chunk_files) != 27:
              raise SystemExit(f"Expected 27 chunks, found {len(chunk_files)}")

          encoded = "".join(p.read_text(encoding="ascii") for p in chunk_files).encode("ascii")
          archive = lzma.decompress(base64.b85decode(encoded))

          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:") as tf:
              members = tf.getmembers()
              files = [m for m in members if m.isfile()]
              if len(files) != 92:
                  raise SystemExit(f"Expected 92 regular files, found {len(files)}")
              for member in files:
                  path = Path(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe archive path: {member.name}")
                  if member.issym() or member.islnk() or not member.isfile():
                      raise SystemExit(f"Unsupported archive member: {member.name}")
                  target = Path(".") / path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  source = tf.extractfile(member)
                  if source is None:
                      raise SystemExit(f"Cannot read: {member.name}")
                  target.write_bytes(source.read())

          manifest = Path("RELEASE-MANIFEST.sha256")
          checked = 0
          for line in manifest.read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              expected, relpath = line.split("  ", 1)
              actual = hashlib.sha256(Path(relpath).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"SHA-256 mismatch: {relpath}")
              checked += 1
          if checked != 91:
              raise SystemExit(f"Expected 91 manifest entries, checked {checked}")
          print(f"Verified {len(files)} files; {checked} SHA-256 hashes match.")

      - name: Commit materialized project
        shell: bash
        run: |
          rm -rf .staging
          rm -f .github/workflows/materialize-source.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import complete Roof and Solar Toolkit source"
          git push origin HEAD:main
