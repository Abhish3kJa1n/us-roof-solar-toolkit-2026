name: Local QA suite

on:
  push:
    branches:
      - "audit/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    name: Run all 22 project checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install the pinned ZIP reader used by research-script regression tests
        run: python -m pip install --disable-pip-version-check "stream-unzip==0.0.101"
      - name: Run complete QA suite
        run: python scripts/run_all_checks.py


  homepage-calculator-smoke:
    name: Browser regression for combined homepage calculator
    if: github.event_name == 'pull_request' && github.head_ref == 'test/homepage-calculator-v2-20261108'
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install pinned Playwright library
        run: |
          npm init -y
          npm install --no-save --no-package-lock playwright@1.65.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test all public pages and combined calculator interactions
        run: node scripts/smoke_calculator_browser.mjs
        env:
          PREVIEW_BASE_URL: https://test-homepage-calculator-v2.roof-solar-toolkit-2026.pages.dev

  browser-calculator-smoke:
    name: Browser calculator and interaction regression smoke
    if: github.event_name == 'pull_request' && github.head_ref == 'test/browser-calculator-smoke-20261108'
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install pinned Playwright library
        run: |
          npm init -y
          npm install --no-save --no-package-lock playwright@1.65.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test all public pages and calculator interactions
        run: node scripts/smoke_calculator_browser.mjs
        env:
          PREVIEW_BASE_URL: https://test-browser-calculator-smok.roof-solar-toolkit-2026.pages.dev

  preview-csp-smoke:
    name: Live Preview CSP nonce and API routing smoke test
    if: github.event_name == 'pull_request' && (github.head_ref == 'feat/preview-csp-nonce-validation-20261108' || github.head_ref == 'audit/guarded-adsense-bootstrap-20261108')
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Test deployed Cloudflare Pages Preview responses
        run: node scripts/smoke_preview_csp.mjs
        env:
          PREVIEW_BASE_URL: https://audit-guarded-adsense-bootstrap-20261108.roof-solar-toolkit-2026.pages.dev

  production-public-smoke:
    name: Live Production Pages and custom-domain edge smoke test
    if: github.event_name == 'pull_request'
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Verify the public Production domains and URLs
        run: node scripts/smoke_production_public.mjs

  production-provider-smoke:
    name: One-time live Production Census, PVWatts and OpenEI check
    if: github.event_name == 'pull_request' && github.head_ref == 'test/production-provider-smoke-20261108'
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Check Production provider configuration and live model responses
        run: node scripts/smoke_production_providers.mjs


  production-multiregion-smoke:
    name: Live Production solar and tariff API smoke across four US regions
    if: github.event_name == 'pull_request' && github.head_ref == 'test/production-multiregion-smoke-20261108'
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Check four regional Census, PVWatts and OpenEI Production paths
        run: node scripts/smoke_production_multiregion.mjs
        env:
          PRODUCTION_BASE_URL: https://roof-solar-toolkit-2026.pages.dev

  live-preview-smoke:
    name: Live Census, PVWatts and OpenEI preview smoke test
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[live-smoke]')
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Test current Cloudflare Pages preview against live upstreams
        run: node scripts/live_preview_smoke.mjs
        env:
          PREVIEW_BASE_URL: https://audit-stage1-20261103.roof-solar-toolkit-2026.pages.dev

