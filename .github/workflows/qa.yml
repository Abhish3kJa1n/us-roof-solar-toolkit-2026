name: Local QA suite

on:
  push:
    branches:
      - "audit/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    name: Run all 22 project checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install the pinned ZIP reader used by research-script regression tests
        run: python -m pip install --disable-pip-version-check "stream-unzip==0.0.101"
      - name: Run complete QA suite
        run: python scripts/run_all_checks.py

  preview-csp-smoke:
    name: Live Preview CSP nonce and API routing smoke test
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/preview-csp-nonce-validation-20261108'
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Test deployed Cloudflare Pages Preview responses
        run: node scripts/smoke_preview_csp.mjs
        env:
          PREVIEW_BASE_URL: https://feat-preview-csp-nonce-valid.roof-solar-toolkit-2026.pages.dev

  production-public-smoke:
    name: Live Production public endpoints and crawler smoke test
    if: github.event_name == 'pull_request' && github.head_ref == 'test/production-public-smoke-20261108'
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Verify the public Production domains and URLs
        run: node scripts/smoke_production_public.mjs

  live-preview-smoke:
    name: Live Census, PVWatts and OpenEI preview smoke test
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[live-smoke]')
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Test current Cloudflare Pages preview against live upstreams
        run: node scripts/live_preview_smoke.mjs
        env:
          PREVIEW_BASE_URL: https://audit-stage1-20261103.roof-solar-toolkit-2026.pages.dev

