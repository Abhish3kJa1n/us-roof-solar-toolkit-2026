name: AHS source-package audit (research-only)

on:
  push:
    branches:
      - "audit/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ahs-source-audit]'))
    name: Inspect official AHS PUF, value labels and C-16 specs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Download and inspect Census source files
        run: python scripts/audit_ahs_source_files.py
