name: Real-browser Preview QA

on:
  push:
    branches:
      - "audit/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'audit/'))
    name: Playwright desktop/mobile and accessibility smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install temporary browser QA packages
        run: npm install --prefix /tmp/roofsolar-playwright --no-save playwright @axe-core/playwright
      - name: Install Chromium
        run: /tmp/roofsolar-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Resolve the Preview alias for this audit branch
        id: preview
        shell: bash
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            slug="audit-guarded-adsense-bootst"
          else
            slug="$(printf '%s' "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9-]#-#g' | cut -c1-28 | sed 's/-*$//')"
          fi
          if [ -z "$slug" ]; then
            echo "Could not derive a Cloudflare Pages Preview alias from branch: $REF_NAME" >&2
            exit 1
          fi
          echo "base_url=https://${slug}.roof-solar-toolkit-2026.pages.dev" >> "$GITHUB_OUTPUT"
      - name: Run real-browser Preview checks
        run: node scripts/browser_preview_smoke.mjs
        env:
          PREVIEW_BASE_URL: ${{ steps.preview.outputs.base_url }}
          EXPECTED_PREVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PLAYWRIGHT_PACKAGE: /tmp/roofsolar-playwright/node_modules/playwright
          AXE_PLAYWRIGHT_PACKAGE: /tmp/roofsolar-playwright/node_modules/@axe-core/playwright
          QA_SCREENSHOT_DIR: browser-qa-output
      - name: Install pinned Lighthouse CLI
        run: npm install --prefix /tmp/roofsolar-lighthouse --no-save lighthouse@13.6.0
      - name: Run mobile Lighthouse audits (diagnostic; no score gate)
        shell: bash
        env:
          PREVIEW_BASE_URL: ${{ steps.preview.outputs.base_url }}
          PLAYWRIGHT_PACKAGE: /tmp/roofsolar-playwright/node_modules/playwright
        run: |
          set -euo pipefail
          mkdir -p browser-qa-output/lighthouse
          export CHROME_PATH="$(node -e "process.stdout.write(require(process.env.PLAYWRIGHT_PACKAGE).chromium.executablePath())")"
          lighthouse_bin="/tmp/roofsolar-lighthouse/node_modules/.bin/lighthouse"
          run_audit() {
            local name="$1"
            local path="$2"
            echo "LIGHTHOUSE_START ${name} ${PREVIEW_BASE_URL}${path}"
            "$lighthouse_bin" "${PREVIEW_BASE_URL}${path}" \
              --quiet \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --form-factor=mobile \
              --throttling-method=simulate \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json \
              --output-path="browser-qa-output/lighthouse/${name}.json"
          }
          run_audit homepage "/"
          run_audit roof-cost "/calculators/roof-replacement-cost"
          run_audit solar-savings "/calculators/solar-savings"
          run_audit city-production "/calculators/location-solar"
          run_audit solar-cost-guide "/guides/solar-installation-cost"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = 'browser-qa-output/lighthouse';
          const files = fs.readdirSync(dir).filter((name) => name.endsWith('.json')).sort();
          for (const file of files) {
            const report = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'));
            const audits = report.audits || {};
            const score = (category) => {
              const value = report.categories?.[category]?.score;
              return value == null ? null : Math.round(value * 100);
            };
            const metric = (id) => {
              const value = audits[id]?.numericValue;
              return value == null ? null : Math.round(value);
            };
            const opportunities = Object.values(audits)
              .filter((audit) => audit.details?.type === 'opportunity' && Number(audit.details.overallSavingsMs) > 0)
              .sort((a, b) => b.details.overallSavingsMs - a.details.overallSavingsMs)
              .slice(0, 3)
              .map((audit) => ({ title: audit.title, savingsMs: Math.round(audit.details.overallSavingsMs) }));
            console.log('LIGHTHOUSE_SUMMARY ' + JSON.stringify({
              page: file.replace(/\.json$/, ''),
              scores: {
                performance: score('performance'),
                accessibility: score('accessibility'),
                bestPractices: score('best-practices'),
                seo: score('seo'),
              },
              interpretation: {
                previewNoindex: audits['is-crawlable']?.score === 0,
                previewAnalyticsCorsExpected: (audits['errors-in-console']?.details?.items || []).some((item) =>
                  item.description?.includes('cloudflareinsights.com/cdn-cgi/rum')
                ),
                note: 'Preview is intentionally noindex. Cloudflare Web Analytics is registered on the production hostname, so its beacon may CORS-fail on the pages.dev preview alias. Neither should be interpreted as a production SEO or console defect.',
              },
              mobileLabMetrics: {
                fcpMs: metric('first-contentful-paint'),
                lcpMs: metric('largest-contentful-paint'),
                totalBlockingTimeMs: metric('total-blocking-time'),
                clsTimes1000: metric('cumulative-layout-shift') == null ? null : Number((audits['cumulative-layout-shift'].numericValue * 1000).toFixed(2)),
                speedIndexMs: metric('speed-index'),
                serverResponseTimeMs: metric('server-response-time'),
              },
              topOpportunities: opportunities,
            }));
          }
          if (files.length !== 5) throw new Error('Expected 5 Lighthouse JSON reports; found ' + files.length);
          NODE
      - name: Retain browser QA artifacts and Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roof-solar-preview-browser-artifacts
          path: browser-qa-output/*
          if-no-files-found: warn
          retention-days: 3
