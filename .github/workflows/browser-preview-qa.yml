name: Real-browser Preview QA
# [browser-qa] Contrast retest after darkening the roof journey label.
# [browser-qa] Audit-only trigger for the homepage journey redesign preview.

on:
  push:
    branches:
      - "audit/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[browser-qa]')) || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'audit/'))
    name: Playwright desktop/mobile and accessibility smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install temporary browser QA packages
        run: npm install --prefix /tmp/roofsolar-playwright --no-save playwright @axe-core/playwright
      - name: Install Chromium
        run: /tmp/roofsolar-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Resolve the Preview alias for this audit branch
        id: preview
        shell: bash
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            slug="audit-guarded-adsense-bootst"
          else
            slug="$(printf '%s' "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9-]#-#g' | cut -c1-28 | sed 's/-*$//')"
          fi
          if [ -z "$slug" ]; then
            echo "Could not derive a Cloudflare Pages Preview alias from branch: $REF_NAME" >&2
            exit 1
          fi
          echo "base_url=https://${slug}.roof-solar-toolkit-2026.pages.dev" >> "$GITHUB_OUTPUT"
      - name: Run real-browser Preview checks
        run: node scripts/browser_preview_smoke.mjs
        env:
          PREVIEW_BASE_URL: ${{ steps.preview.outputs.base_url }}
          PLAYWRIGHT_PACKAGE: /tmp/roofsolar-playwright/node_modules/playwright
          AXE_PLAYWRIGHT_PACKAGE: /tmp/roofsolar-playwright/node_modules/@axe-core/playwright
          QA_SCREENSHOT_DIR: browser-qa-output
      - name: Retain browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roof-solar-preview-browser-screenshots
          path: browser-qa-output/*.png
          if-no-files-found: warn
          retention-days: 3
